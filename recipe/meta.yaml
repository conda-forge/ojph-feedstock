{% set version = "0.10.1" %}
{% set fork_version = "1.0.1" %}

package:
  name: ojph
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/o/ojph/ojph-{{ version }}.tar.gz
    sha256: e515f7df85a800610af31c04724f742899d879307532fe478ab11fc7aa91d87a
  # Since 0.10.0, ojph statically links the "ojph" fork of OpenJPH (renamed
  # so it is co-installable with upstream OpenJPH) instead of linking the
  # openjph package. The static link is deliberate: this Python package is
  # the fork's only consumer and the two are co-developed and released
  # together, so there is no library to share with other packages. The tag
  # ojph-{{ fork_version }} pins git hash
  # f03eff4909aa3f0538949e0a2ef3d20f23a39994.
  - url: https://github.com/hmaarrfk/OpenJPH/archive/refs/tags/ojph-{{ fork_version }}.tar.gz
    sha256: a7a22ed59e5b863883e675ae92dc7a9b01e2a8cd0b40c746f6f6776ee0e84293
    folder: subprojects/ojph

build:
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - nanobind
    # header-only build dependency of the vendored fork (Google Highway
    # SIMD kernels); nothing is linked at run time
    - libhwy
  run:
    - python
    - numpy >=2.1

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - ojph

about:
  home: https://github.com/ramonaoptics/ojph
  summary: 'Python bindings for OpenJPH, a JPEG 2000 codec'
  license: BSD-3-Clause AND BSD-2-Clause
  license_file:
    - LICENSE.txt
    - subprojects/ojph/LICENSE
  dev_url: https://github.com/ramonaoptics/ojph

extra:
  recipe-maintainers:
    - hmaarrfk
