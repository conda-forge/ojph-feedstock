{% set version = "0.11.0" %}

package:
  name: ojph
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/ojph/ojph-{{ version }}.tar.gz
  sha256: 86b1f79ca6ac3e0f4db7d52da57305bbfb5d72dbaf5853cfbf7f19e23d80a424

build:
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - pkgconf
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - nanobind
    # The shared C++ library of the OpenJPH fork; its run_exports pin the
    # run time libojph to the same <major>.<minor>.
    - libojph >=1.2.0,<1.3
  run:
    - python
    - numpy >=2.1

test:
  requires:
    - pip
  commands:
    - pip check
    - python -c "import numpy as np, ojph; image = np.arange(64 * 48, dtype=np.uint16).reshape(64, 48); data = ojph.imwrite_to_memory(image, wavelet='rev12'); assert (ojph.imread_from_memory(data) == image).all(); assert (ojph.imread_from_memory(data, level=2) == image[::4, ::4]).all()"
  imports:
    - ojph

about:
  home: https://github.com/ramonaoptics/ojph
  summary: 'Python bindings for OpenJPH, a JPEG 2000 codec'
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
  dev_url: https://github.com/ramonaoptics/ojph

extra:
  recipe-maintainers:
    - hmaarrfk
