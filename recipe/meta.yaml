{% set version = "0.10.2" %}

package:
  name: ojph
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/ojph/ojph-{{ version }}.tar.gz
  sha256: c31d832461eb00e8171891cbe8e9932bbf3db367e355838f200542aadfbbf40b
  patches:
    # Backport of ramonaoptics/ojph#42: setup.py only searched
    # CONDA_PREFIX for libhwy; under conda-build the host prefix is
    # PREFIX, so the extension underlinked. Drop with the next release.
    - patches/0001-search-prefix-for-libhwy.patch
    # Backport of ramonaoptics/ojph#44: OJPH_SYSTEM_LIBOJPH=1 links the
    # installed libojph found with pkg-config. Drop with the release that
    # contains it.
    - patches/0002-optionally-link-an-installed-libojph.patch

build:
  number: 2
  skip: true  # [py<312]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - pkgconf
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - nanobind
    # The shared C++ library of the OpenJPH fork; its run_exports pin the
    # run time libojph to the same <major>.<minor>.
    - libojph >=1.1.2,<1.2
  run:
    - python
    - numpy >=2.1

test:
  requires:
    - pip
  commands:
    - pip check
    - python -c "import numpy as np, ojph; image = np.arange(64 * 48, dtype=np.uint16).reshape(64, 48); data = ojph.imwrite_to_memory(image, wavelet='rev12'); assert (ojph.imread_from_memory(data) == image).all(); assert (ojph.imread_from_memory(data, level=2) == image[::4, ::4]).all()"
  imports:
    - ojph

about:
  home: https://github.com/ramonaoptics/ojph
  summary: 'Python bindings for OpenJPH, a JPEG 2000 codec'
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
  dev_url: https://github.com/ramonaoptics/ojph

extra:
  recipe-maintainers:
    - hmaarrfk
